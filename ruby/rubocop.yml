inherit_from: .rubocop_todo.yml
inherit_gem:
  rubocop-rubyfmt:
    - config/full.yml
inherit_mode:
  merge:
    - Exclude

plugins:
  - "rubocop-rubyfmt"
  - "rubocop-md"
  - "rubocop-packaging"
  - "rubocop-rake"

Layout/LineLength:
  Max: 120
  Exclude:
    - "test/**/*.rb"

Metrics/BlockLength:
  Exclude:
    - "test/**/*.rb"
    - "*.gemspec"
Metrics/ClassLength:
  Exclude:
    - "test/**/*.rb"
Metrics/MethodLength:
  Exclude:
    - "test/**/*.rb"

Style/AsciiComments:
  Enabled: false
Style/Documentation:
  Enabled: false
Style/IfUnlessModifier:
  Enabled: false

AllCops:
  NewCops: enable
  TargetRubyVersion: 3.4
  Exclude:
    - "vendor/**/*"
